name: Build Kissly apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '构建平台（默认同时构建 Android 和 iOS）'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - android
          - ios
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

concurrency:
  group: mobile-${{ github.ref }}-${{ github.event.inputs.platform || 'both' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    # Manual runs can select iOS only. Push/tag runs keep the old behavior and
    # build both platforms.
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kissly-android
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform != 'android' }}
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
      - name: Build unsigned app
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Kissly-unsigned.ipa Payload
          ls -lh Kissly-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kissly-ios-unsigned
          path: mobile/Kissly-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # A manually dispatched tag build may skip one platform. Release as long as
    # every requested platform succeeded and at least one artifact exists.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && (needs.android.result == 'success' || needs.android.result == 'skipped') && (needs.ios.result == 'success' || needs.ios.result == 'skipped') && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        if: ${{ needs.android.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: kissly-android
          path: release-assets
      - name: Download IPA
        if: ${{ needs.ios.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: kissly-ios-unsigned
          path: release-assets
      - name: Prepare release assets
        run: |
          set -e
          mkdir -p .github/release-notes
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            printf "# Kissly %s\n" "$GITHUB_REF_NAME" > "$NOTES"
          fi

          APK=""
          IPA=""
          if [ -f release-assets/app-release.apk ]; then
            mv release-assets/app-release.apk release-assets/kissly-android.apk
            APK="release-assets/kissly-android.apk"
          fi
          if [ -f release-assets/Kissly-unsigned.ipa ]; then
            IPA="release-assets/Kissly-unsigned.ipa"
          fi
          ls -lh release-assets

          {
            echo ""
            echo "### 校验值（SHA256）"
            echo ""
            if [ -n "$APK" ]; then
              echo "- \`kissly-android.apk\`：\`$(sha256sum "$APK" | awk '{print $1}' | tr '[:lower:]' '[:upper:]')\`"
            fi
            if [ -n "$IPA" ]; then
              echo "- \`Kissly-unsigned.ipa\`：\`$(sha256sum "$IPA" | awk '{print $1}' | tr '[:lower:]' '[:upper:]')\`"
            fi
          } >> "$NOTES"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Kissly ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            release-assets/kissly-android.apk
            release-assets/Kissly-unsigned.ipa
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
