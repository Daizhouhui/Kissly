name: Build Kissly apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kissly-android
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
      - name: Build unsigned app
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Kissly-unsigned.ipa Payload
          ls -lh Kissly-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kissly-ios-unsigned
          path: mobile/Kissly-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: kissly-android
          path: release-assets
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: kissly-ios-unsigned
          path: release-assets
      - name: Prepare release assets
        run: |
          mv release-assets/app-release.apk release-assets/kissly-android.apk
          ls -lh release-assets
      - name: Append SHA256 checksums
        run: |
          APK_SHA=$(sha256sum release-assets/kissly-android.apk | awk '{print $1}' | tr '[:lower:]' '[:upper:]')
          IPA_SHA=$(sha256sum release-assets/Kissly-unsigned.ipa | awk '{print $1}' | tr '[:lower:]' '[:upper:]')
          {
            echo ""
            echo "### 校验值（SHA256）"
            echo ""
            echo "- \`kissly-android.apk\`：\`$APK_SHA\`"
            echo "- \`Kissly-unsigned.ipa\`：\`$IPA_SHA\`"
          } >> .github/release-notes/v1.2.7.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Kissly ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: .github/release-notes/v1.2.7.md
          files: |
            release-assets/kissly-android.apk
            release-assets/Kissly-unsigned.ipa
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
